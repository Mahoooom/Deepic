name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Fail before the long compile if the updater signing secrets are absent.
      # The values themselves are never printed.
      - name: Check updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            Write-Error "Missing GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          }

      # tauri-action creates/updates GitHub Release tag v{version} from
      # tauri.conf.json / Cargo.toml and uploads .exe + .msi.
      # With the signing secrets set, it also signs those installers and
      # uploads latest.json for the in-app updater.
      # Same version on a later main push rebuilds and replaces those assets.
      # Bump the app version when you want a new release tag.
      - name: Build Windows app and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Deepic v__VERSION__
          releaseBody: |
            图片旋转压缩工具 Windows 安装包（未代码签名）。

            从 0.1.3 起，打开软件会自动检查更新。发现新版本时点「立即更新」即可下载安装并重启。

            正在使用 0.1.2 或更早版本的用户，需要先手动安装这一版。更早的版本里没有应用内更新。

            构建提交: ${{ github.sha }}

            下载 Assets 中的 `.exe` / `.msi` 安装即可。若 Windows 提示未知发布者，选择“仍要运行”即可。
          releaseDraft: false
          prerelease: false
          includeDebug: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi
